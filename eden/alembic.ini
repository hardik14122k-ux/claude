# Alembic config for the eden_control (shared control-plane) schema.
# Per-client tenant schemas are NOT migrated here — they are provisioned and
# migrated by eden.provisioning.schema_provisioner using the versioned SQL
# templates under migrations/tenant_template/.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
# sqlalchemy.url is injected at runtime from EDEN_DB_ADMIN_DSN (see migrations/env.py).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
