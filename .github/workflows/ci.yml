name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eden
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eden_owner
          POSTGRES_PASSWORD: eden_owner_pw
          POSTGRES_DB: eden
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U eden_owner -d eden"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type check (mypy — advisory until strict-clean)
        run: mypy src || true
      - name: Tests (unit + integration against the postgres service)
        run: pytest -q
