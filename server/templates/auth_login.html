{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:64px auto">
  <h1>Sign in</h1>
  <form method="post" action="{{ url_for('auth.login') }}" class="form-grid">
    <label>Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p class="muted small">Default admin: <code>admin@example.com</code> / <code>admin</code> (created on first run if no user exists).</p>
</div>
{% endblock %}
