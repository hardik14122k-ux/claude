<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TalentTrack — Recruitment Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">TT</span>
      <div>
        <div class="brand-title">TalentTrack</div>
        <div class="brand-sub">Recruitment OS</div>
      </div>
    </div>
    <nav id="nav">
      <a data-route="dashboard" class="nav-item active"><span>Dashboard</span></a>
      <a data-route="vacancies" class="nav-item"><span>Vacancies</span></a>
      <a data-route="candidates" class="nav-item"><span>Candidates</span></a>
      <a data-route="pipeline" class="nav-item"><span>Pipeline</span></a>
      <a data-route="interviews" class="nav-item"><span>Interviews</span></a>
      <a data-route="reports" class="nav-item"><span>Reports</span></a>
      <a data-route="settings" class="nav-item"><span>Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <button id="seed-btn" class="btn ghost">Load demo data</button>
      <button id="reset-btn" class="btn danger-ghost">Reset</button>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div class="search">
        <input id="globalSearch" placeholder="Search candidates, vacancies, skills..." />
      </div>
      <div class="topbar-actions">
        <button class="btn primary" id="quick-upload">+ Upload CV</button>
        <button class="btn" id="quick-vacancy">+ New Vacancy</button>
      </div>
    </header>

    <section id="view" class="view"></section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window['pdfjsLib']) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
